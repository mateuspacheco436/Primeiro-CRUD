spring.datasource.url=jdbc:postgresql://localhost:5432/crud
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082

# Obrigatorias: defina como variaveis de ambiente
api.security.token.secret=${JWT_SECRET}

# Opcionais: se definidas, cria um usuario ADMIN na primeira inicializacao
api.security.admin.nome=${ADMIN_NOME:}
api.security.admin.email=${ADMIN_EMAIL:}
api.security.admin.senha=${ADMIN_SENHA:}
